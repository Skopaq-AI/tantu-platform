name: CD

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Override semver (e.g. 0.2.0, else .version / git tag)"
        required: false
        type: string

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY_GHCR: ghcr.io
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || '' }}
  GCP_GAR_REPO: ${{ vars.GCP_GAR_REPOSITORY || 'tantu' }}
  GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || '' }}
  GCP_WIF_SERVICE_ACCOUNT: ${{ vars.GCP_WIF_SERVICE_ACCOUNT || '' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "::notice::CD skipped — CI did not succeed"
            fi
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: build · ${{ matrix.service }}:${{ matrix.port }}
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: adapter-fabric
            port: "8001"
            context: ./services/adapter-fabric
            dockerfile: ./services/adapter-fabric/Dockerfile
          - service: edge-perception
            port: "8002"
            context: ./services/edge-perception
            dockerfile: ./services/edge-perception/Dockerfile
          - service: reasoning-copilot
            port: "8003"
            context: ./services/reasoning-copilot
            dockerfile: ./services/reasoning-copilot/Dockerfile
          - service: orchestrator
            port: "8004"
            context: ./services/orchestrator
            dockerfile: ./services/orchestrator/Dockerfile
          - service: api-gateway
            port: "8000"
            context: ./services/api-gateway
            dockerfile: ./services/api-gateway/Dockerfile
          - service: frontend
            port: "3000"
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - name: Checkout (full history for semver)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -e
          INPUT_VER="${{ inputs.version }}"
          if [ -n "$INPUT_VER" ]; then
            VER="$INPUT_VER"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          elif [ -f .version ]; then
            VER="$(tr -d ' \t\n\r' < .version)"
          else
            VER="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo '0.1.0')"
          fi
          VER="${VER#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "resolved version: $VER"
          echo "VERSION=$VER" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Auth to GCP via Workload Identity Federation
        if: env.GCP_WIF_PROVIDER != '' && env.GCP_WIF_SERVICE_ACCOUNT != '' && env.GCP_PROJECT_ID != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to GAR
        if: env.GCP_PROJECT_ID != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ secrets.GCP_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Fallback gcloud auth configure-docker
        if: env.GCP_PROJECT_ID != ''
        run: |
          if command -v gcloud >/dev/null 2>&1; then
            gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet || true
          else
            echo "::notice::gcloud not available — GAR push may be skipped if token missing"
          fi
        continue-on-error: true

      - name: Docker meta — GHCR
        id: meta-ghcr
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/tantu-${{ matrix.service }}
          flavor: latest=true
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}},value=v${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.VERSION }}
            type=semver,pattern={{major}},value=v${{ env.VERSION }}

      - name: Docker meta — GAR
        id: meta-gar
        if: env.GCP_PROJECT_ID != ''
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_GAR_REPO }}/${{ matrix.service }}
          flavor: latest=true
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}},value=v${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.VERSION }}
            type=semver,pattern={{major}},value=v${{ env.VERSION }}

      - name: Compute combined tags
        id: tags
        run: |
          GHCR_TAGS="${{ steps.meta-ghcr.outputs.tags }}"
          GAR_TAGS="${{ steps.meta-gar.outputs.tags }}"
          TAGS="$(echo "$GHCR_TAGS" | tr '\n' ',' | sed 's/,$//')"
          if [ -n "$GAR_TAGS" ] && [ "${{ env.GCP_PROJECT_ID }}" != "" ]; then
            GAR_CSV="$(echo "$GAR_TAGS" | tr '\n' ',' | sed 's/,$//')"
            TAGS="$TAGS,$GAR_CSV"
          fi
          if [ -z "$TAGS" ] || [ "$TAGS" = "," ]; then
            TAGS="${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/tantu-${{ matrix.service }}:${{ env.VERSION }},${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/tantu-${{ matrix.service }}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Combined tags:"
          echo "$TAGS" | tr ',' '\n'
          echo "labels=${{ steps.meta-ghcr.outputs.labels }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            VERSION=${{ env.VERSION }}
            SERVICE=${{ matrix.service }}
            PORT=${{ matrix.port }}

      - name: Image digest
        run: echo "Pushed ${{ matrix.service }}:${{ env.VERSION }} (port ${{ matrix.port }})"

  cd-gate:
    name: CD gate
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always()
    steps:
      - name: Check CD matrix
        run: |
          result="${{ needs.build-and-push.result }}"
          echo "build-and-push: $result"
          if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
            echo "::error::CD failed"
            exit 1
          fi
          echo "CD passed"
