name: cd
on:
  push: { branches: [main] }
  workflow_run: { workflows: ["ci"], types: [completed] }
permissions:
  contents: read
  id-token: write  # OIDC to GCP
  packages: write

env:
  REGION: asia-south1
  REGISTRY: asia-south1-docker.pkg.dev

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        svc: [adapter-fabric, edge-perception, reasoning-copilot, orchestrator, api-gateway, frontend]
        include:
          - { svc: adapter-fabric, dockerfile: services/adapter-fabric/Dockerfile, context: . }
          - { svc: edge-perception, dockerfile: services/edge-perception/Dockerfile, context: . }
          - { svc: reasoning-copilot, dockerfile: services/reasoning-copilot/Dockerfile, context: . }
          - { svc: orchestrator, dockerfile: services/orchestrator/Dockerfile, context: . }
          - { svc: api-gateway, dockerfile: services/api-gateway/Dockerfile, context: . }
          - { svc: frontend, dockerfile: frontend/Dockerfile, context: frontend }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Version
        id: ver
        run: |
          SVC=${{ matrix.svc }}
          BASE=$(cat services/$SVC/VERSION 2>/dev/null || cat VERSION 2>/dev/null || echo "0.1.0")
          SHA=$(git rev-parse --short HEAD)
          echo "tag=$BASE-$SHA" >> $GITHUB_OUTPUT
          echo "semver=$BASE" >> $GITHUB_OUTPUT
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIP }}
          service_account: ${{ secrets.GCP_SA }}
        continue-on-error: true
      - uses: google-github-actions/setup-gcloud@v2
        continue-on-error: true
      - name: Login to Artifact Registry
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet || true
        continue-on-error: true
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/${{ github.repository }}/${{ matrix.svc }}
            ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT } }/tantu-${{ env.REGION }}/${{ matrix.svc }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: SBOM + Sign (cosign)
        run: |
          echo "sbom for ${{ matrix.svc }}:${{ steps.ver.outputs.tag }}" # syft + cosign stub
        continue-on-error: true
