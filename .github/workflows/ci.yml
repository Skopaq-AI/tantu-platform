name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  python:
    name: python · ${{ matrix.service }} (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - adapter-fabric
          - edge-perception
          - reasoning-copilot
          - orchestrator
          - api-gateway
        include:
          - service: adapter-fabric
            import: adapter_fabric
          - service: edge-perception
            import: edge_perception
          - service: reasoning-copilot
            import: reasoning_copilot
          - service: orchestrator
            import: orchestrator
          - service: api-gateway
            import: gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/pyproject.toml

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles(format('services/{0}/pyproject.toml', matrix.service)) }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install service (editable + dev)
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff — lint
        working-directory: services/${{ matrix.service }}
        run: |
          ruff check src tests --output-format=github
          ruff check src tests --statistics || true

      - name: Ruff — format check
        working-directory: services/${{ matrix.service }}
        run: |
          ruff format --check src tests || echo '::warning::ruff format unformatted'

      - name: Mypy — type check
        working-directory: services/${{ matrix.service }}
        run: |
          mypy src --ignore-missing-imports --show-error-codes || echo '::warning::mypy failed'

      - name: Pytest
        working-directory: services/${{ matrix.service }}
        run: pytest -q --tb=short --junitxml=pytest-${{ matrix.service }}.xml -o cache_dir=/tmp/pytest_cache

      - name: Upload pytest JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.service }}
          path: services/${{ matrix.service }}/pytest-${{ matrix.service }}.xml
          if-no-files-found: ignore

  frontend:
    name: frontend (eslint · tsc · vitest · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            frontend/.next/cache
            ~/.npm
          key: next-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.ts', 'frontend/**/*.tsx') }}
          restore-keys: |
            next-${{ runner.os }}-
            next-

      - name: Install (npm ci)
        run: |
          if [ -f package-lock.json ]; then npm ci --legacy-peer-deps; else npm install --legacy-peer-deps; fi

      - name: ESLint
        run: |
          npm run lint -- --max-warnings=0 || npm run lint || echo '::warning::eslint failed'

      - name: Typecheck (tsc --noEmit)
        run: |
          npx tsc --noEmit || echo '::warning::tsc failed'

      - name: Vitest
        run: |
          npm test -- --reporter=junit --outputFile=junit.xml || echo '::warning::vitest failed'

      - name: Build (Next.js)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Upload frontend JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-junit
          path: frontend/junit.xml
          if-no-files-found: ignore

  pip-audit:
    name: pip-audit · ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [adapter-fabric, edge-perception, reasoning-copilot, orchestrator, api-gateway]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/pyproject.toml
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Run pip-audit
        working-directory: services/${{ matrix.service }}
        run: |
          pip-audit --format=json --output=pip-audit.json --local || echo "::warning::pip-audit found vulnerabilities (see artifact)"
          pip-audit || true
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-${{ matrix.service }}
          path: services/${{ matrix.service }}/pip-audit.json
          if-no-files-found: ignore

  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci --legacy-peer-deps; else npm install --legacy-peer-deps; fi
      - name: npm audit
        run: |
          npm audit --audit-level=moderate || echo "::warning::npm audit found vulnerabilities"
          npm audit --json > npm-audit.json || true
      - name: Upload npm audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: frontend/npm-audit.json
          if-no-files-found: ignore

  gitleaks:
    name: gitleaks (secrets scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --no-git -v --redact --format sarif --report-path gitleaks.sarif
        continue-on-error: true
      - name: Upload SARIF (if produced)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
        continue-on-error: true
      - name: Gitleaks fallback (docker)
        if: always()
        run: |
          if [ -f gitleaks.sarif ]; then echo "gitleaks sarif uploaded"; else echo "no sarif — running gitleaks docker fallback"; docker run --rm -v "$PWD:/path" zricethezav/gitleaks:latest detect --source /path --no-git -v || true; fi

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [python, frontend, pip-audit, npm-audit, gitleaks]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo '${{ toJson(needs) }}' | python3 -c "
          import sys, json
          needs=json.load(sys.stdin)
          import os
          ok=True
          for job in ['python','frontend']:
              r=needs.get(job,{}).get('result')
              print(f'{job}: {r}')
              if r not in ('success','skipped'):
                  print(f'::error::{job} failed — blocking merge')
                  ok=False
          for job in ['pip-audit','npm-audit','gitleaks']:
              r=needs.get(job,{}).get('result')
              print(f'{job}: {r} (non-blocking)')
          sys.exit(0 if ok else 1)
          "
          echo "CI gate passed"
