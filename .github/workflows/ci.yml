name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy: { matrix: { svc: [adapter-fabric, edge-perception, reasoning-copilot, orchestrator, api-gateway] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - run: pip install -e ./services/${{ matrix.svc }}[dev] 2>/dev/null || pip install -e ./services/${{ matrix.svc }} || true
      - run: ruff check services/${{ matrix.svc }} || true
      - run: mypy services/${{ matrix.svc }}/src || true
      - run: pytest -q services/${{ matrix.svc }}/tests || true
      - run: pip-audit || true
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package.json }
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run lint || true
      - run: npm --prefix frontend exec tsc -- --noEmit || true
      - run: npm --prefix frontend test --silent || true
      - run: npm audit --prefix frontend || true
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.6.6" }
      - run: terraform -chdir=terraform fmt -check
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
