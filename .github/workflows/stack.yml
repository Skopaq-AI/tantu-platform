name: Stack — Up / Down

# Dedicated pipeline to bring the entire TANTU stack up or down via IaC.
# Uses the existing terraform + helm + k8s manifests.
# Trigger: manual only (workflow_dispatch) to avoid accidental destroy on push.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Stack action"
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy, scale-to-zero]
      env:
        description: "Environment"
        required: true
        default: dev
        type: choice
        options: [dev, prod]
      confirm_destroy:
        description: 'Type "destroy" to confirm destroy/scale-to-zero'
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: "1.6.6"
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'tantu-beta-20260821-01' }}

jobs:
  plan:
    if: inputs.action == 'plan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform -chdir=terraform fmt -check || (terraform -chdir=terraform fmt -diff && exit 1)
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIP }}
          service_account: ${{ secrets.GCP_SA }}
      - run: |
          terraform -chdir=terraform init -backend-config="bucket=${{ env.GCP_PROJECT_ID }}-tfstate" -backend-config="prefix=env/${{ inputs.env }}"
          terraform -chdir=terraform plan -var-file=envs/${{ inputs.env }}.tfvars -var="project_id=${{ env.GCP_PROJECT_ID }}" -out=tfplan

  apply:
    if: inputs.action == 'apply' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIP }}
          service_account: ${{ secrets.GCP_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          terraform -chdir=terraform init -backend-config="bucket=${{ env.GCP_PROJECT_ID }}-tfstate" -backend-config="prefix=env/${{ inputs.env }}"
          terraform -chdir=terraform apply -var-file=envs/${{ inputs.env }}.tfvars -var="project_id=${{ env.GCP_PROJECT_ID }}" -auto-approve
      - run: |
          gcloud container clusters get-credentials tantu-${{ inputs.env }}-gke --region ${{ env.GCP_REGION }} --project ${{ env.GCP_PROJECT_ID }}
          kubectl apply -f terraform/infra/k8s/redis.yaml
          helm upgrade --install tantu terraform/infra/k8s/helm/tantu -n tantu --create-namespace -f terraform/infra/k8s/helm/tantu/values-${{ inputs.env }}.yaml
          kubectl apply -f terraform/infra/k8s/gateway.yaml
          kubectl apply -f terraform/infra/k8s/vllm.l4.yaml || echo "::warning::vLLM needs GPUS_ALL_REGIONS quota"
      - run: echo "::notice::Stack UP — Gateway https://console.cloud.google.com/kubernetes/gateway/regions/${{ env.GCP_REGION }}/gateways/tantu-${{ inputs.env }}-gateway?project=${{ env.GCP_PROJECT_ID }}"

  destroy:
    if: inputs.action == 'destroy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4
      - if: inputs.confirm_destroy != 'destroy'
        run: |
          echo "::error::Refusing destroy — confirm_destroy must be exactly 'destroy'"
          exit 1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIP }}
          service_account: ${{ secrets.GCP_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Self-heal destroy IAM (servicenetworking + redis)
        run: |
          SA="${{ secrets.GCP_SA }}"
          PROJECT="${{ env.GCP_PROJECT_ID }}"
          echo "Self-healing IAM for $SA on $PROJECT"
          for ROLE in "roles/servicenetworking.admin" "roles/redis.admin"; do
            echo "Granting $ROLE to $SA"
            gcloud projects add-iam-policy-binding "$PROJECT" --member="serviceAccount:$SA" --role="$ROLE" --condition=None 2>&1 | tail -n 5 ||             gcloud projects add-iam-policy-binding "$PROJECT" --member="serviceAccount:$SA" --role="$ROLE" 2>&1 | tail -n 5 || echo "::warning::could not grant $ROLE (may not exist)"
          done
          echo "Waiting 15s for IAM propagation"
          sleep 15
          gcloud projects get-iam-policy "$PROJECT" --flatten="bindings[].members" --filter="bindings.members:$SA" --format="value(bindings.role)" | sort | uniq | head -n 30 || true
      - run: |
          gcloud container clusters get-credentials tantu-${{ inputs.env }}-gke --region ${{ env.GCP_REGION }} --project ${{ env.GCP_PROJECT_ID }} || true
          helm uninstall tantu -n tantu || true
          kubectl delete -f terraform/infra/k8s/gateway.yaml --ignore-not-found || true
      - name: Terraform destroy (with refresh retry)
        run: |
          terraform -chdir=terraform init -backend-config="bucket=${{ env.GCP_PROJECT_ID }}-tfstate" -backend-config="prefix=env/${{ inputs.env }}"
          set +e
          terraform -chdir=terraform destroy -var-file=envs/${{ inputs.env }}.tfvars -var="project_id=${{ env.GCP_PROJECT_ID }}" -auto-approve
          EC=$?
          if [ $EC -ne 0 ]; then
            echo "::warning::destroy with refresh failed (code $EC), retrying with state rm + refresh=false"
            terraform -chdir=terraform state rm 'module.vpc.google_service_networking_connection.private_vpc_connection[0]' 2>&1 | tail -n 20 || true
            terraform -chdir=terraform destroy -var-file=envs/${{ inputs.env }}.tfvars -var="project_id=${{ env.GCP_PROJECT_ID }}" -auto-approve -refresh=false
            EC=$?
            if [ $EC -ne 0 ]; then
              echo "::error::destroy still failed (code $EC), attempting targeted destroy of remaining resources"
              # As last resort, try to delete GKE and SQL via gcloud directly to stop billing, then force-unlock state if needed
              gcloud container clusters delete tantu-${{ inputs.env }}-gke --region ${{ env.GCP_REGION }} --project ${{ env.GCP_PROJECT_ID }} --quiet || true
              gcloud sql instances delete tantu-${{ inputs.env }}-pg16 --project ${{ env.GCP_PROJECT_ID }} --quiet || true
              gcloud redis instances delete tantu-${{ inputs.env }}-redis --region ${{ env.GCP_REGION }} --project ${{ env.GCP_PROJECT_ID }} --quiet || true
              terraform -chdir=terraform destroy -var-file=envs/${{ inputs.env }}.tfvars -var="project_id=${{ env.GCP_PROJECT_ID }}" -auto-approve -refresh=false || true
            fi
          fi
          # Final clean: remove peering via gcloud if abandoned
          gcloud services vpc-peerings delete --service=servicenetworking.googleapis.com --network=tantu-${{ inputs.env }}-vpc --project=${{ env.GCP_PROJECT_ID }} 2>&1 | tail -n 10 || echo "peering already removed or abandoned"
          echo "Destroy step complete"


  scale-to-zero:
    if: inputs.action == 'scale-to-zero' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4
      - if: inputs.confirm_destroy != 'destroy'
        run: |
          echo "::error::Refusing scale-to-zero — confirm_destroy must be exactly 'destroy'"
          exit 1
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIP }}
          service_account: ${{ secrets.GCP_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gcloud container clusters get-credentials tantu-${{ inputs.env }}-gke --region ${{ env.GCP_REGION }} --project ${{ env.GCP_PROJECT_ID }}
          kubectl scale deployment -n tantu --all --replicas=0 || true
          kubectl scale rollout -n tantu --all --replicas=0 || true
          kubectl scale statefulset -n tantu --all --replicas=0 || true
          gcloud sql instances patch tantu-${{ inputs.env }}-pg16 --activation-policy=NEVER --project ${{ env.GCP_PROJECT_ID }} || true
          echo "::notice::Stack scaled to zero — GKE workloads 0, CloudSQL NEVER. Resume via workflow_dispatch action=apply or kubectl scale --replicas=1"
