[project]
name = "tantu-backend"
version = "0.3.11"
description = "TANTU backend — Clean Arch, FastAPI, GENAI-ready"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.110.*",
  "uvicorn[standard]==0.30.*",
  "pydantic==2.8.*",
  "pydantic-settings==2.4.*",
  "sqlalchemy==2.0.*",
  "alembic==1.13.*",
  "psycopg[binary]==3.1.*",
  "redis==5.0.*",
  "nats-py==2.6.*",
  "python-jose[cryptography]==3.3.*",
  "passlib[bcrypt]==1.7.*",
  "httpx==0.27.*",
  "opentelemetry-api==1.24.*",
  "opentelemetry-sdk==1.24.*",
  "structlog==24.*",
]

[project.optional-dependencies]
dev = ["pytest==8.*","pytest-asyncio==0.23.*","ruff==0.5.*","mypy==1.10.*","pip-audit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
