services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: tantu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tantu_dev_only_change_me}
      POSTGRES_DB: tantu
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tantu"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  nats:
    image: nats:2-alpine
    ports: ["4222:4222", "8222:8222"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  adapter-fabric:
    build: ./services/adapter-fabric
    ports: ["8001:8001"]
    environment:
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379/0
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
    depends_on: [nats, redis]
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:8001/health"], interval: 10s, retries: 5 }

  edge-perception:
    build: ./services/edge-perception
    ports: ["8002:8002"]
    environment:
      ADAPTER_FABRIC_URL: http://adapter-fabric:8001
      NATS_URL: nats://nats:4222
      TIER: ${EDGE_TIER:-orin-nano}  # pi5-hailo | orin-nano | thor
    depends_on: [adapter-fabric, redis]
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:8002/health"], interval: 10s, retries: 5 }

  reasoning-copilot:
    build: ./services/reasoning-copilot
    ports: ["8003:8003"]
    environment:
      QDRANT_URL: http://qdrant:6333
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      VLLM_URL: ${VLLM_URL:-http://vllm:8000}
      NATS_URL: nats://nats:4222
    depends_on: [qdrant, nats]

  orchestrator:
    build: ./services/orchestrator
    ports: ["8004:8004"]
    environment:
      DATABASE_URL: postgresql+psycopg://tantu:${POSTGRES_PASSWORD:-tantu_dev_only_change_me}@postgres:5432/tantu
      NATS_URL: nats://nats:4222
      REASONING_URL: http://reasoning-copilot:8003
    depends_on: [postgres, nats, reasoning-copilot]

  api-gateway:
    build: ./services/api-gateway
    ports: ["8000:8000"]
    environment:
      ADAPTER_FABRIC_URL: http://adapter-fabric:8001
      EDGE_URL: http://edge-perception:8002
      REASONING_URL: http://reasoning-copilot:8003
      ORCHESTRATOR_URL: http://orchestrator:8004
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-dev-only-key-replace-in-prod}
      REDIS_URL: redis://redis:6379/0
    depends_on: [adapter-fabric, edge-perception, reasoning-copilot, orchestrator]

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api-gateway]

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes: ["./infra/prometheus.yml:/etc/prometheus/prometheus.yml"]

volumes:
  postgres_data:
  qdrant_data:
