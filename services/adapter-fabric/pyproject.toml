[project]
name = "adapter-fabric"
version = "0.3.11"
description = "TANTU Adapter Fabric — multi-protocol shopfloor ingestion (OPC-UA, Modbus, MQTT, MTConnect, EtherNet/IP, Camera) — Hexagonal + Clean"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — TANTU" }
dependencies = [
    "fastapi>=0.110,<0.150",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "httpx>=0.27,<1",
    "asyncua>=1.1,<2",
    "pymodbus>=3.6,<4",
    "paho-mqtt>=2.1,<3",
    "nats-py>=2.6,<3",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",
    "structlog>=24,<27",
    "opentelemetry-api>=1.24,<2",
    "opentelemetry-sdk>=1.24,<2",
    "opentelemetry-exporter-otlp>=1.24,<2",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "prometheus-client>=0.20,<1",
    "opencv-python>=4.10,<6",
    "numpy>=1.26,<3",
    "pycomm3>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.*",
    "pytest-asyncio==0.23.*",
    "httpx==0.27.*",
    "anyio==4.*",
    "ruff==0.5.*",
    "mypy==1.10.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_fabric"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.uvicorn]
host = "0.0.0.0"
port = 8001
