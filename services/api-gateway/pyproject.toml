[project]
name = "tantu-api-gateway"
version = "0.9.3"
description = "TANTU API Gateway — FastAPI + CORS + Helmet + Redis rate-limit + JWT RS256 + OPA-style RBAC/ABAC + reverse proxy + health aggregation + audit log — Clean Arch + DDD + event-driven"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — TANTU" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "python-jose[cryptography]>=3.3",
    "cryptography>=42",
    "passlib[bcrypt]>=1.7",
    "structlog>=24",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "prometheus-client>=0.20",
    "asyncua>=1.1,<2",
    "zeroconf>=0.130,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "anyio>=4",
    "ruff>=0.5",
    "mypy>=1.10",
    "cryptography>=42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.uvicorn]
host = "0.0.0.0"
port = 8000
