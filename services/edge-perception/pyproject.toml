[project]
name = "edge-perception"
version = "0.9.1"
description = "TANTU Edge Perception — tiered offline-first inference (gauge CV + vibration FFT + thermal + CT-clamp) — FastAPI on 8002"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — TANTU" }
dependencies = [
    "fastapi==0.110.*",
    "uvicorn[standard]==0.30.*",
    "pydantic==2.8.*",
    "pydantic-settings==2.4.*",
    "numpy==1.26.*",
    "scipy==1.13.*",
    "opencv-python==4.10.*",
    "redis==5.0.*",
    "prometheus-client==0.20.*",
    "python-jose[cryptography]==3.3.*",
    "passlib[bcrypt]==1.7.*",
    "httpx==0.27.*",
    "structlog>=24,<27",
    "opentelemetry-api==1.24.*",
    "opentelemetry-sdk==1.24.*",
    "anyio==4.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.*",
    "pytest-asyncio==0.23.*",
    "httpx==0.27.*",
    "anyio==4.*",
    "ruff==0.5.*",
    "mypy==1.10.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_perception"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false

[tool.uvicorn]
host = "0.0.0.0"
port = 8002
