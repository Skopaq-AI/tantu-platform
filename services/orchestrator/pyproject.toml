[project]
name = "tantu-orchestrator"
version = "0.8.1"
description = "TANTU Orchestrator — event window policy (2 faults or conf≥0.97 → escalate), NATS subscriber, reasoning-copilot integration, TimescaleDB persistence, idempotency — Clean Arch + DDD + event-driven"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — TANTU" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "nats-py>=2.6",
    "python-jose[cryptography]>=3.3",
    "structlog>=24",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "anyio>=4",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.uvicorn]
host = "0.0.0.0"
port = 8004
