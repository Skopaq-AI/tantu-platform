[project]
name = "reasoning-copilot"
version = "0.3.1"
description = "TANTU Reasoning Copilot — dual-sourced GENAI (Gemini ER2 + Nemotron-9B), RAG (Qdrant), vernacular hi/ta/te/kn — FastAPI 8003"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — TANTU / Skopaq AI" }
keywords = ["genai", "rag", "qdrant", "gemini", "nemotron", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "qdrant-client>=1.9",
  # GENAI
  "google-genai>=0.3",
  # embeddings — sentence-transformers optional; stub provides cosine fallback
  "numpy>=1.26",
  # telemetry
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "opentelemetry-exporter-otlp>=1.24",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "structlog>=24",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "anyio>=4",
  "ruff>=0.5",
  "mypy>=1.10",
]
# sentence-transformers is optional (hash fallback works without it); install separately if offline model needed
# pip install sentence-transformers>=3.0

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reasoning_copilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.uvicorn]
host = "0.0.0.0"
port = 8003
