# TANTU — External Secrets wiring (Secret Manager → K8s Secret `tantu-secrets`)
# Install ESO first: helm upgrade --install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
# This file contains:
#  1. SecretStore (GCP Secret Manager via Workload Identity)
#  2. ExternalSecret that syncs Secret Manager keys into k8s Secret `tantu-secrets` (used by backend, adapter-fabric, etc.)
# Secrets are accessed via workload identity:
#   IAM binding: roles/secretmanager.secretAccessor granted to GSA `tantu-<env>-tantu-api` ↔ KSA `tantu/api`
#   Annotation: iam.gke.io/gcp-service-account on ServiceAccount `api` (see values.yaml)
# No placeholder sentinel — values come from random_password (terraform/modules/secrets) and are rotated via
#   `gcloud secrets versions add tantu-<env>-<key> --data-file=-`
# For bootstrap without ESO, use manual sync:
#   gcloud secrets versions access latest --secret=tantu-dev-db-password --project=$PROJECT_ID | \
#     kubectl create secret generic tantu-secrets --from-literal=DATABASE_URL="postgres://..." -n tantu --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-store
  namespace: tantu
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID # replace or set via --set global.projectId
      auth:
        workloadIdentity:
          clusterLocation: asia-south1
          clusterName: tantu-dev-gke
          serviceAccountRef:
            name: api
            namespace: tantu
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tantu-secrets
  namespace: tantu
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-store
  target:
    name: tantu-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: tantu-dev-db-password
        # ESO can template DB URL from components if needed; here we store full URL in Secret Manager
    - secretKey: postgres-host
      remoteRef:
        key: tantu-dev-db-password
        property: host # if stored as JSON; otherwise use full secret
    - secretKey: qdrant-api-key
      remoteRef:
        key: tantu-dev-qdrant-api-key
    - secretKey: gemini-api-key
      remoteRef:
        key: tantu-dev-gemini-api-key
    - secretKey: hf-token
      remoteRef:
        key: tantu-dev-hf-token
    - secretKey: jwt-private-key
      remoteRef:
        key: tantu-dev-jwt-private-key
