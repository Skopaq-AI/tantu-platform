# TANTU — GKE Gateway API manifests
# Requires: gateway_api_config.channel = CHANNEL_STANDARD + Gateway controller
# Apply after Terraform: kubectl apply -f infra/k8s/gateway.yaml
# Get IP: kubectl get gateway tantu-gateway -n tantu
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tantu-gateway
  namespace: tantu
  annotations:
    # Bind to the static global IP created by Terraform (modules/gke)
    networking.gke.io/static-ips: tantu-dev-gke-gateway-ip
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: { from: Same }
      # HTTP only for dev — add HTTPS+ManagedCertificate in prod
  addresses:
    - type: NamedAddress
      value: tantu-dev-gke-gateway-ip
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tantu-routes
  namespace: tantu
spec:
  parentRefs:
    - name: tantu-gateway
  hostnames: ["api.tantu.example.com"] # replace with real domain
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
        - path: { type: PathPrefix, value: /health }
        - path: { type: PathPrefix, value: /docs }
      backendRefs:
        - name: tantu-backend
          port: 80
          weight: 100
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: tantu-frontend
          port: 80
          weight: 100
---
# Health check policy for Gateway backends
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: tantu-backend-hc
  namespace: tantu
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck: { port: 8000, requestPath: /health }
  targetRef:
    group: ""
    kind: Service
    name: tantu-backend
---
