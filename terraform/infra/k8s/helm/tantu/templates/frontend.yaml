{{- if .Values.frontend.enabled | default true }}
apiVersion: apps/v1
kind: Deployment
metadata: { name: tantu-frontend, namespace: {{ .Release.Namespace }} }
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector: { matchLabels: { app: tantu-frontend } }
  template:
    metadata: { labels: { app: tantu-frontend } }
    spec:
      containers:
        - name: web
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}{{ if .Values.frontend.image.digest }}@{{ .Values.frontend.image.digest }}{{ end }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy | default "IfNotPresent" }}
          ports: [{ containerPort: 3000 }, { containerPort: 8080 }]
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext: { runAsNonRoot: false, readOnlyRootFilesystem: false, allowPrivilegeEscalation: false }
      {{- if .Values.frontend.nodeSelector }}
      nodeSelector: {{- toYaml .Values.frontend.nodeSelector | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata: { name: tantu-frontend, namespace: {{ .Release.Namespace }} }
spec:
  selector: { app: tantu-frontend }
  ports: [{ port: {{ .Values.frontend.service.port }}, targetPort: 3000 }]
{{- end }}
