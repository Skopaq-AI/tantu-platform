# Gateway + HTTPRoute are intentionally NOT templated via Helm in prod — they are cluster-scoped infra managed via kubectl/ArgoCD
# This file is a copy for helm rendering; prefer terraform/infra/k8s/gateway.yaml as source of truth.
{{- if .Values.gateway.enabled | default false }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: tantu-gateway, namespace: {{ .Release.Namespace }} }
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - { name: http, protocol: HTTP, port: 80, allowedRoutes: { namespaces: { from: Same } } }
    - { name: https, protocol: HTTPS, port: 443, allowedRoutes: { namespaces: { from: Same } }, tls: { mode: Terminate } }
{{- end }}
