# TANTU downstream microservices — dev
# Images pinned by digest: asia-south1-docker.pkg.dev/tantu-beta-20260821-01/tantu/<service>:v0.9.0@sha256:<digest>
# Build-time: Cloud Build pushes :<commit-sha> and :<version>; k8s manifests reference immutable digest.
# Update digests after each release: `gcloud artifacts docker images describe <image>:<tag> --show-package-vulnerability` or `crane digest`.
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: tantu
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: tantu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2-alpine@sha256:c0b7e76a6c9c8622af06b363b66446c70ae4c4f7105897de6d77075e8cdd5083 # pinned digest for nats:2-alpine
          args:
            - "-js"
          ports:
            - containerPort: 4222
            - containerPort: 8222
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 4222
            initialDelaySeconds: 5
          readinessProbe:
            tcpSocket:
              port: 4222
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: adapter-fabric
  namespace: tantu
spec:
  selector:
    app: adapter-fabric
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adapter-fabric
  namespace: tantu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adapter-fabric
  template:
    metadata:
      labels:
        app: adapter-fabric
    spec:
      containers:
        - name: api
          image: asia-south1-docker.pkg.dev/tantu-beta-20260821-01/tantu/adapter-fabric:v0.9.0@sha256:ffb7b4bd8f61df228a99082b3e77e50f08e34526a54604e8444fa8807c0fbf2d
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tantu-secrets
                  key: DATABASE_URL
            - name: NATS_URL
              value: nats://nats:4222
            - name: REDIS_URL
              value: redis://redis:6379/0 # PVC-backed in-cluster redis (standard-rwo)
          envFrom:
            - secretRef:
                name: tantu-secrets
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
---
