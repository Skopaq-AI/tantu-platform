# TANTU downstream microservices — dev
# Images: asia-south1-docker.pkg.dev/tantu-beta-20260821-01/tantu/<service>:latest
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: tantu
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: tantu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2-alpine
          args:
            - "-js"
          ports:
            - containerPort: 4222
            - containerPort: 8222
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 4222
            initialDelaySeconds: 5
          readinessProbe:
            tcpSocket:
              port: 4222
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: adapter-fabric
  namespace: tantu
spec:
  selector:
    app: adapter-fabric
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adapter-fabric
  namespace: tantu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adapter-fabric
  template:
    metadata:
      labels:
        app: adapter-fabric
    spec:
      containers:
        - name: api
          image: asia-south1-docker.pkg.dev/tantu-beta-20260821-01/tantu/adapter-fabric:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: NATS_URL
              value: nats://nats:4222
            - name: REDIS_URL
              value: redis://10.30.49.75:6378/0
          envFrom:
            - secretRef:
                name: tantu-secrets
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: edge-perception
  namespace: tantu
spec:
  selector:
    app: edge-perception
  ports:
    - name: http
      port: 8002
      targetPort: 8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-perception
  namespace: tantu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-perception
  template:
    metadata:
      labels:
        app: edge-perception
    spec:
      containers:
        - name: api
          image: asia-south1-docker.pkg.dev/tantu-beta-20260821-01/tantu/edge-perception:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: ADAPTER_FABRIC_URL
              value: http://adapter-fabric:8001
            - name: NATS_URL
              value: nats://nats:4222
            - name: TIER
              value: orin-nano
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: reasoning-copilot
  namespace: tantu
spec:
  selector:
    app: reasoning-copilot
  ports:
    - name: http
      port: 8003
      targetPort: 8003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reasoning-copilot
  namespace: tantu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reasoning-copilot
  template:
    metadata:
      labels:
        app: reasoning-copilot
    spec:
      containers:
        - name: api
          image: asia-south1-docker.pkg.dev/tantu-beta-20260821-01/tantu/reasoning-copilot:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
              name: http
          env:
            - name: QDRANT_URL
              value: http://tantu-qdrant:6333
            - name: NATS_URL
              value: nats://nats:4222
            - name: VLLM_URL
              value: http://vllm:8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: tantu
spec:
  selector:
    app: orchestrator
  ports:
    - name: http
      port: 8004
      targetPort: 8004
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: tantu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: api
          image: asia-south1-docker.pkg.dev/tantu-beta-20260821-01/tantu/orchestrator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8004
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tantu-secrets
                  key: DATABASE_URL
            - name: NATS_URL
              value: nats://nats:4222
            - name: REASONING_URL
              value: http://reasoning-copilot:8003
            - name: QDRANT_URL
              value: http://tantu-qdrant:6333
          envFrom:
            - secretRef:
                name: tantu-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
