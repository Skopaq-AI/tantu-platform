# TANTU Redis — in-cluster (PVC-backed) for dev; Memorystore for prod (terraform/modules/redis)
# PVC wiring: redis-data (standard-rwo, 5Gi) mounted at /data with --appendonly yes --dir /data
# Survives pod reschedule to new node (Autopilot). Qdrant PVC is via StatefulSet volumeClaimTemplates (standard-rwo).
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: tantu
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: tantu
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard-rwo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: tantu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      tolerations:
        - key: autoscaling.gke.io/scale-out
          operator: Exists
      containers:
        - name: redis
          image: redis:7-alpine@sha256:f1fb85a670f841df695aecff0c0c06e0851c653f38f3d1ba32664b2727f5e1c1 # pinned digest
          ports:
            - containerPort: 6379
          args: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--dir", "/data"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
