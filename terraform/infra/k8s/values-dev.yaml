# TANTU — dev overrides — cost-optimized
global:
  env: dev

backend:
  replicaCount: 1
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  nodeSelector:
    cloud.google.com/compute-class: Scale-Out # Spot
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
  env:
    - name: ENV
      value: dev
    - name: LOG_LEVEL
      value: debug

frontend:
  replicaCount: 1
  nodeSelector:
    cloud.google.com/compute-class: Scale-Out
  autoscaling: { enabled: false }

qdrant:
  replicaCount: 1
  persistence: { size: 10Gi }

argoRollouts:
  analysis:
    enabled: false # no automated promotion gates in dev — manual
