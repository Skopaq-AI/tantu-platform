# TANTU — dev overrides — cost-optimized
global:
  env: dev

backend:
  replicaCount: 1
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  nodeSelector: {} # dev: allow any node (was Scale-Out Spot causing 1Gi Autopilot mutation + single NAP capacity)
  tolerations: []
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
  env:
    - name: ENV
      value: dev
    - name: LOG_LEVEL
      value: debug
    - name: ADAPTER_FABRIC_URL
      value: http://adapter-fabric:8001
    - name: EDGE_PERCEPTION_URL
      value: http://edge-perception:8002
    - name: REASONING_COPILOT_URL
      value: http://reasoning-copilot:8003
    - name: ORCHESTRATOR_URL
      value: http://orchestrator:8004
    - name: REASONING_URL
      value: http://reasoning-copilot:8003
    - name: EDGE_URL
      value: http://edge-perception:8002

frontend:
  replicaCount: 1
  resources:
    requests: { cpu: 150m, memory: 512Mi }
    limits: { cpu: 300m, memory: 768Mi }
  nodeSelector: {} # dev: allow any node (was Scale-Out causing 1229Mi mutation + scheduling failure)
  autoscaling: { enabled: false }

qdrant:
  replicaCount: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: standard-rwo

argoRollouts:
  analysis:
    enabled: false # no automated promotion gates in dev — manual
