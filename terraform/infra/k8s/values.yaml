# TANTU — Helm values (base) — Autopilot + Gateway API + Argo Rollouts canary
# Image pulls from Artifact Registry: asia-south1-docker.pkg.dev/<project>/tantu/<service>:<tag>@sha256:<digest>
# Pinned digests: update after `docker buildx` push (see CD workflow "Image digest" step or `crane digest`).
# Deploy via: helm upgrade --install tantu ./helm/tantu -f infra/k8s/values.yaml -f infra/k8s/values-<env>.yaml

global:
  projectId: "" # injected via --set global.projectId=$PROJECT_ID
  region: asia-south1
  env: dev
  registry: asia-south1-docker.pkg.dev/PROJECT_ID/tantu

# ── Backend API (FastAPI) — Rollout with canary ──
backend:
  replicaCount: 2
  image:
    repository: asia-south1-docker.pkg.dev/PROJECT_ID/tantu/backend
    tag: v0.9.0 # pinned tag — override: --set backend.image.tag=$COMMIT_SHA
    digest: sha256:82811da871b677315d6273a9724e7adc56645e0eb0f15d9075520a920fae6d17 # pinned digest for backend:v0.9.0
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: api
    annotations:
      iam.gke.io/gcp-service-account: tantu-dev-tantu-api@PROJECT_ID.iam.gserviceaccount.com

  # Autopilot resource profile — requests == limits recommended
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Autopilot compute class — use Balanced/on-demand in prod, empty (any) in dev to avoid Scale-Out 1Gi/1229Mi mutation + single NAP capacity
  nodeSelector: {}
  tolerations: []

  env:
    - name: ENV
      value: dev
    - name: POSTGRES_HOST
      valueFrom:
        secretKeyRef: { name: tantu-secrets, key: postgres-host }
    - name: REDIS_HOST
      value: tantu-dev-redis
    - name: QDRANT_URL
      value: http://qdrant:6333
  envFrom:
    - secretRef: { name: tantu-secrets }

  ports:
    - name: http
      containerPort: 8000
      protocol: TCP

  probes:
    liveness: { httpGet: { path: /health, port: http }, initialDelaySeconds: 15, periodSeconds: 10 }
    readiness: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5, periodSeconds: 5 }

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities: { drop: ["ALL"] }

  # Autoscaling — HPA (Autopilot handles node provisioning)
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleUp: { stabilizationWindowSeconds: 60, policies: [{ type: Pods, value: 2, periodSeconds: 60 }] }
      scaleDown: { stabilizationWindowSeconds: 300, policies: [{ type: Pods, value: 1, periodSeconds: 60 }] }

  service:
    type: ClusterIP
    port: 80
    targetPort: 8000

# ── Frontend (Next.js) — standard Deployment behind same Gateway ──
frontend:
  replicaCount: 2
  image:
    repository: asia-south1-docker.pkg.dev/PROJECT_ID/tantu/frontend
    tag: v0.9.0 # pinned
    digest: sha256:44f523aa4d0c0fd2e4e1cff0d747db8bcaf442843cb56eed9d9f2905be843ff8 # pinned digest for frontend:v0.9.0
    pullPolicy: IfNotPresent
  serviceAccount:
    create: false
  resources:
    requests: { cpu: 150m, memory: 512Mi }
    limits: { cpu: 300m, memory: 768Mi }
  nodeSelector: {}
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70 }

# ── Qdrant is deployed via Terraform helm_release; values here are for reference/sync only ──
# PVC wiring: standard-rwo is Autopilot default; size 10Gi dev / 50Gi prod; StatefulSet volumeClaimTemplates
qdrant:
  enabled: true
  replicaCount: 1 # 3 in prod (see values-prod.yaml)
  persistence:
    enabled: true
    size: 10Gi
    storageClass: standard-rwo

# ── Argo Rollouts — controller installed via Terraform or via Helm here ──
argoRollouts:
  enabled: true
  controller:
    replicas: 1
