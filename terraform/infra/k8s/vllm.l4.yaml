# TANTU vLLM — Nemotron-9B on L4 (GKE Autopilot)
# ==============================================================================
# GPU QUOTA WIRING — DOCUMENTATION
# ==============================================================================
# This Deployment requires GKE Autopilot GPU quota for NVIDIA L4 in region asia-south1.
#
# 1. QUOTA PREREQUISITES
#    - Quota name:  NVIDIA_L4_GPUS (per-region) + optional NVIDIA_L4_GPUS_PER_NODE if enforced
#    - Region:      asia-south1 (Mumbai) — matches var.region and cluster location
#    - Required:    1 L4 GPU (requests nvidia.com/gpu: 1). For HA / rolling, request 2.
#    - Check:       gcloud compute project-info describe --project=tantu-beta-20260821-01 \
#                     --format="json(quotas)" | jq '.quotas[] | select(.metric | contains("NVIDIA_L4"))'
#                  gcloud compute accelerator-types list --filter="name:nvidia-l4" \
#                     --project=tantu-beta-20260821-01
#                  gcloud compute regions describe asia-south1 --project=tantu-beta-20260821-01 \
#                     --format="json(quotas)" | jq '.quotas[] | select(.metric | contains("L4"))'
#
# 2. HOW TO REQUEST QUOTA
#    Console: IAM & Admin → Quotas → filter "NVIDIA L4 GPUs" → asia-south1 → Edit Quotas → Request 1-2
#    CLI:     gcloud alpha services quota update --service=compute.googleapis.com \
#               --consumer=projects/tantu-beta-20260821-01 --metric=nvidia_l4_gpus \
#               --unit="1/{project}/{region}" --value=1 --dimensions=region=asia-south1
#            Or file a support case via Cloud Console → Support → Quotas.
#    Wait 24-48h for approval. Until approved, pods stay Pending (Insufficient nvidia.com/gpu)
#    but the cluster and other workloads are unaffected — DualRouter fallback keeps
#    reasoning-copilot serving grounded mocks without vLLM.
#
# 3. AUTOPILOT GPU WIRING (this file)
#    - nodeSelector:  cloud.google.com/gke-accelerator: nvidia-l4
#      → Tells Autopilot to provision an L4 accelerator node. For Standard GKE, use
#        nodeSelector: { accelerator: nvidia-tesla-l4 } or a GPU node-pool label.
#    - tolerations:   - key: nvidia.com/gpu, operator: Exists, effect: NoSchedule
#      → Required to schedule onto GPU tainted nodes.
#    - resources:     requests/limits: nvidia.com/gpu: 1 + cpu 4, memory 20-24Gi
#      → Resource request triggers Autopilot node provisioning. Must match limits.
#    - strategy:      Recreate (GPU cannot be shared across pods concurrently).
#    - annotation:    cloud.google.com/gke-gpu-driver-version: "latest" (driver auto-install)
#    - volumes:       emptyDir medium: Memory for /dev/shm 8Gi (NCCL shared memory).
#      Optional PVC vllm-model-cache 40Gi (standard-rwo) for HF cache to speed cold start.
#
# 4. APPLY / VERIFY
#    kubectl apply -f vllm.l4.yaml
#    kubectl describe pod -n tantu -l app=vllm   # check Events for quota/scheduling
#    kubectl logs -n tantu -l app=vllm -c vllm --follow
#    kubectl get events -n tantu --sort-by=.lastTimestamp | grep -i -E "gpu|quota|FailedScheduling"
#    # Health: curl http://vllm:8000/health  or  http://vllm:8000/v1/models
#
# 5. COST & LIFECYCLE
#    - L4 nodes bill per-second while Pod is scheduled; scale to 0 when idle via
#      `kubectl scale deployment vllm -n tantu --replicas=0` or HPA on queue depth.
#    - No preemption: GPU pods are not Spot/preemptible by default.
#    - Image pin: vllm/vllm-openai:v0.6.3@sha256:<digest> — update via `crane digest`
#    - Fallback: reasoning-copilot checks VLLM_URL=http://vllm:8000/v1/chat/completions;
#      if unreachable, returns grounded mock (no stub / no crash).
# ==============================================================================
# Apply ONLY when L4 quota available; otherwise pods stay Pending but cluster is unaffected
# DualRouter fallback keeps reasoning-copilot serving grounded mocks.
#   kubectl apply -f vllm.l4.yaml
# Troubleshoot: kubectl describe pod -n tantu -l app=vllm ; kubectl logs -n tantu -l app=vllm -c vllm
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: tantu
  labels: { app: vllm }
spec:
  selector: { app: vllm }
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: tantu
  labels: { app: vllm }
spec:
  replicas: 1
  strategy:
    type: Recreate  # GPU cannot share
  selector:
    matchLabels: { app: vllm }
  template:
    metadata:
      labels: { app: vllm }
      annotations:
        # Autopilot triggers GPU provisioning via resource request; optional driver pin
        cloud.google.com/gke-gpu-driver-version: "latest"
    spec:
      terminationGracePeriodSeconds: 60
      # ── GKE Autopilot L4 accelerator class ──
      # For Standard GKE, replace with: nodeSelector: { accelerator: nvidia-tesla-l4 } or node pool label
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.3@sha256:246d1b25a7828c2c8890a2b79d3892a94a509e24fb3cfb93798e7f24faea0795 # pinned digest
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - --model=nvidia/NVIDIA-Nemotron-Nano-9B-v2
            # Use --served-model-name so clients can request "nemotron-9b" regardless of HF repo
            - --served-model-name=nemotron-9b
            - --host=0.0.0.0
            - --port=8000
            - --max-model-len=4096
            - --gpu-memory-utilization=0.90
            - --enforce-eager
            - --dtype=auto
            - --trust-remote-code
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tantu-secrets
                  key: hf-token
                  optional: true
            - name: VLLM_LOGGING_LEVEL
              value: INFO
          resources:
            requests:
              cpu: "4"
              memory: 20Gi
              ephemeral-storage: 30Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "4"
              memory: 24Gi
              ephemeral-storage: 30Gi
              nvidia.com/gpu: 1
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 120  # model load
            periodSeconds: 15
            failureThreshold: 6
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 12
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            # - name: model-cache  # optional PVC for HF cache
            #   mountPath: /root/.cache/huggingface
          securityContext:
            runAsNonRoot: false  # vLLM needs root for shm/nccl; lock down via readOnlyRootFilesystem:false
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        # - name: model-cache
        #   persistentVolumeClaim:
        #     claimName: vllm-model-cache
              # Create PVC separately: kubectl apply -f - <<EOF
              # apiVersion: v1; kind: PersistentVolumeClaim
              # metadata: {name: vllm-model-cache, namespace: tantu}
              # spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 40Gi}}}
              # EOF
